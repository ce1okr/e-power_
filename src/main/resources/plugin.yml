name: EmpoweredSMP
version: '1.0.0'
main: com.empoweredsmp.EmpoweredSMP
api-version: '26.2'
author: YourName
description: Empowered SMP - custom ability RPG plugin (Strength, Defense, Mobility, Ranger, Vitality, Elemental, Invisibility, Prosperity)

commands:
  class:
    description: Assign or change a player's ability (admin only; resets them to Level 0)
    usage: /class <player> <ability>
    permission: empoweredsmp.admin
  ei:
    description: Open your Prosperity extra inventory
    usage: /ei
  toolchoice:
    description: 'Prosperity Low Tier: permanently choose your 2 netherite tool types'
    usage: /toolchoice <tool1> <tool2>
  curse:
    description: 'Prosperity: curse an online player (cooldown applies)'
    usage: /curse <player>
  empowered:
    description: Admin control command for Empowered SMP
    usage: /empowered <info|setlevel|resetdeaths> <player> [value]
    permission: empoweredsmp.admin
    aliases: [esmp, eadmin]
  unlocknether:
    description: Permanently unlock the Nether for all players
    usage: /unlocknether
    permission: empoweredsmp.op
  unlockend:
    description: Permanently unlock the End for all players
    usage: /unlockend
    permission: empoweredsmp.op
  unlockvillagers:
    description: Permanently unlock villager trading for all players
    usage: /unlockvillagers
    permission: empoweredsmp.op

permissions:
  empoweredsmp.admin:
    description: Can assign abilities and manage player tiers
    default: op
  empoweredsmp.op:
    description: Can permanently unlock global world/villager gates
    default: op
