# EmpoweredSMP configuration.
# Tiers: Level 0 (starting state, kit only) -> Low Tier -> High Tier.
# Per-tier values use "low" / "high" keys. Every number from the ability
# spec lives here so you can rebalance without recompiling.
#
# If you edit this file, keep config-version as is. When the plugin is updated
# to a newer config-version it saves your old file as config-old.yml and
# writes a fresh one.
config-version: 2

effect-tick-interval-ticks: 20

global-gates:
  # Seeds first-run defaults only; the live values are stored in global-state.yml.
  nether-unlocked: false
  end-unlocked: false
  villagers-unlocked: false

# "Enemies" for Main Abilities = players who damaged you within memory-seconds
# and are within radius blocks (same world).
enemies:
  memory-seconds: 30
  radius: 20

caps:
  golden-apples-normal: 64
  golden-apples-vitality: 96            # Vitality Low + High
  enchanted-golden-apples: {low: 2, high: 3}
  xp-bottles-normal: 128
  xp-bottles-prosperity-stacks: 3       # 3 stacks = 192 (Prosperity Low + High)
  totems-normal: 1
  totems-prosperity: 2                  # Prosperity Low + High
  cobwebs-normal: 64
  cobwebs-mobility: 128                 # Mobility Low + High
  wind-charges: 128
  ender-pearls-max: 6
  ender-pearl-cooldown-seconds: 30

enchant-caps:
  protection-normal: 3
  protection-vitality: 4                # Vitality Low + High
  sharpness-normal: 4                   # also Smite / Bane of Arthropods
  sharpness-strength: 5                 # Strength High
  power-normal: 4
  power-ranger: 5                       # Ranger Low + High

strength:
  hit-multiplier-chance: {low: 0.25, high: 0.50}
  hit-multiplier: 1.5
  main:
    trigger-hearts: 4
    weakness-amplifier: 4               # Weakness V
    duration-seconds: {low: 15, high: 30}
    cooldown-seconds: {low: 60, high: 90}

defense:
  zero-damage-chance: {low: 0.15, high: 0.30}
  reflect-chance: {low: 0.15, high: 0.30}
  reflect-multiplier: 2.0
  main:
    trigger-hearts: 5
    weakness-amplifier: 1               # Weakness II
    slowness-amplifier: 0               # Slowness I
    duration-seconds: {low: 15, high: 30}
    cooldown-seconds: {low: 60, high: 90}

mobility:
  lunge-cooldown-seconds: 15
  main:
    trigger-hearts: 4
    slowness-amplifier: 2               # Slowness III
    mining-fatigue-amplifier: 0         # Mining Fatigue I
    duration-seconds: {low: 30, high: 45}
    cooldown-seconds: {low: 120, high: 110}

ranger:
  damage-bonus: {low: 0.30, high: 0.60}
  glowing-arrow-seconds: 30
  main:
    hits-required: 3
    slowness-amplifier: 9               # Slowness X
    mining-fatigue-amplifier: 2         # Mining Fatigue III
    duration-seconds: {low: 15, high: 25}
    cooldown-seconds: {low: 60, high: 70}

vitality:
  max-hearts: {level0: 11, low: 13, high: 15}
  main:
    trigger-hearts: 4
    regeneration-amplifier: 4           # Regeneration V
    duration-seconds: {low: 10, high: 20}
    cooldown-seconds: {low: 60, high: 70}

elemental:
  nether-hearts: {low: 13, high: 16}

invisibility:
  main:
    trigger-hearts: 4
    duration-seconds: {low: 30, high: 60}
    cooldown-seconds: {low: 90, high: 130}

prosperity:
  xp-multiplier: {low: 1.5, high: 2.0}
  potion-multiplier: {low: 1.5, high: 2.0}
  extra-inventory-slots: {low: 18, high: 27}
  trade-discount-low: 0.5               # Low Tier: 50% off. High Tier: 1 emerald per trade.
  curse:
    cooldown-hours: {low: 5, high: 3}
    duration-hours: 2
    hearts: 9
